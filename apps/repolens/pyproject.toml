[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens"
version = "0.1.0"
description = "Chat with any public GitHub repo, running locally on Ollama"
requires-python = ">=3.10"
dependencies = ["ollama"]

[tool.setuptools.packages.find]
where = ["src"]
