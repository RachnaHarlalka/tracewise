services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=repolens_user
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=repolens_db
    ports:
      - "5433:5432"
    volumes:
      - repolens_data:/var/lib/postgresql/data
      - ./apps/repolens/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
volumes:
  repolens_data:
